<!doctype html>
<html lang="en">
  <head>
    <script>
      // Runtime constraint: HMR is disabled in AI Studio dev environment. Ignore WebSocket errors.
      (function () {
        var origError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function (a) { return (a && a.stack) ? a.stack : String(a); }).join(' ');
          if (text.indexOf('WebSocket') !== -1 || (text.indexOf('vite') !== -1 && text.indexOf('connect') !== -1)) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function (e) {
          var msg = e.reason && (e.reason.message || String(e.reason));
          if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1)) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>

        if (msg && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1)) {
